<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celestial Artifact - Concept Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a12 0%, #1a1625 50%, #0d0d18 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #fffef0;
            overflow: hidden;
        }

        .demo-title {
            font-size: 1.2rem;
            color: rgba(255, 254, 240, 0.6);
            margin-bottom: 60px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }

        /* Artifact Container */
        .artifact {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 20px 40px;
            perspective: 1000px;
        }

        /* Gold vein decorations */
        .artifact::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(201, 162, 39, 0.3) 20%,
                rgba(201, 162, 39, 0.5) 50%,
                rgba(201, 162, 39, 0.3) 80%,
                transparent 100%
            );
            transform: translateY(-50%);
            pointer-events: none;
        }

        /* Hexagonal Slot */
        .slot {
            width: 52px;
            height: 60px;
            position: relative;
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        /* Arc curve - rotate end slots */
        .slot:first-child { transform: rotate(-12deg) translateY(8px); }
        .slot:nth-child(2) { transform: rotate(-6deg) translateY(3px); }
        .slot:nth-child(5) { transform: rotate(6deg) translateY(3px); }
        .slot:last-child { transform: rotate(12deg) translateY(8px); }

        .slot:hover {
            transform: scale(1.08);
        }
        .slot:first-child:hover { transform: rotate(-12deg) translateY(8px) scale(1.08); }
        .slot:nth-child(2):hover { transform: rotate(-6deg) translateY(3px) scale(1.08); }
        .slot:nth-child(5):hover { transform: rotate(6deg) translateY(3px) scale(1.08); }
        .slot:last-child:hover { transform: rotate(12deg) translateY(8px) scale(1.08); }

        .slot-inner {
            width: 100%;
            height: 100%;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            background: linear-gradient(180deg, #1a1625 0%, #2d1f3d 100%);
            border: none;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        /* Nebula swirl effect for empty slots */
        .slot-inner::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(
                from 0deg,
                transparent 0%,
                rgba(88, 66, 133, 0.25) 25%,
                transparent 50%,
                rgba(60, 80, 140, 0.2) 75%,
                transparent 100%
            );
            animation: nebulaSwirl 8s linear infinite;
            opacity: 0.4;
            pointer-events: none;
        }

        @keyframes nebulaSwirl {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Hex border glow */
        .slot-inner::after {
            content: '';
            position: absolute;
            inset: 2px;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            background: transparent;
            border: 1px solid rgba(201, 162, 39, 0.2);
            pointer-events: none;
            transition: all 0.3s ease;
        }

        /* Filled slot - star captured */
        .slot.filled .slot-inner {
            background: radial-gradient(circle at center,
                #fffef0 0%,
                #ffd700 30%,
                #c9a227 60%,
                #2d1f3d 100%
            );
            box-shadow:
                0 0 20px rgba(255, 254, 240, 0.4),
                0 0 40px rgba(201, 162, 39, 0.3),
                inset 0 0 15px rgba(255, 254, 240, 0.5);
        }

        .slot.filled .slot-inner::before {
            background: radial-gradient(circle, rgba(255, 254, 240, 0.8) 0%, transparent 60%);
            animation: starPulse 2s ease-in-out infinite;
            opacity: 1;
        }

        @keyframes starPulse {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        .slot.filled .slot-inner::after {
            border-color: rgba(255, 254, 240, 0.6);
            box-shadow: 0 0 10px rgba(255, 254, 240, 0.3);
        }

        /* First empty slot hint pulse */
        .slot.next-empty .slot-inner {
            animation: hintPulse 2s ease-in-out infinite;
        }

        @keyframes hintPulse {
            0%, 100% {
                box-shadow: 0 0 5px rgba(201, 162, 39, 0.2);
            }
            50% {
                box-shadow: 0 0 15px rgba(201, 162, 39, 0.5), 0 0 25px rgba(201, 162, 39, 0.2);
            }
        }

        /* State: Building (2-4 filled) */
        .artifact.state-building .slot.filled .slot-inner::before {
            animation: starPulse 1.5s ease-in-out infinite;
        }

        .artifact.state-building::before {
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(201, 162, 39, 0.5) 20%,
                rgba(255, 215, 0, 0.6) 50%,
                rgba(201, 162, 39, 0.5) 80%,
                transparent 100%
            );
            animation: veinPulse 2s ease-in-out infinite;
        }

        @keyframes veinPulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* State: Ready (5 filled) */
        .artifact.state-ready .slot.filled .slot-inner::before {
            animation: starPulse 0.8s ease-in-out infinite;
        }

        .artifact.state-ready::before {
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(255, 215, 0, 0.7) 20%,
                rgba(255, 254, 240, 0.8) 50%,
                rgba(255, 215, 0, 0.7) 80%,
                transparent 100%
            );
            animation: veinPulse 0.8s ease-in-out infinite;
            height: 3px;
        }

        .artifact.state-ready {
            animation: artifactAnticipation 0.5s ease-in-out infinite;
        }

        @keyframes artifactAnticipation {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        /* Completion: Gather phase */
        .artifact.gathering .slot.filled .slot-inner {
            animation: gatherInward 0.4s ease-in forwards;
        }

        @keyframes gatherInward {
            0% { transform: scale(1); }
            100% { transform: scale(0.85); filter: brightness(1.5); }
        }

        .artifact.gathering::before {
            animation: gatherVein 0.4s ease-in forwards;
        }

        @keyframes gatherVein {
            0% { opacity: 1; }
            100% { opacity: 0; height: 0; }
        }

        /* Completion: Burst phase */
        .artifact.bursting .slot.filled .slot-inner {
            animation: burstOutward 0.5s ease-out forwards;
        }

        @keyframes burstOutward {
            0% { transform: scale(0.85); filter: brightness(2); }
            50% { transform: scale(1.3); filter: brightness(2.5); opacity: 1; }
            100% { transform: scale(1); filter: brightness(1); opacity: 1; }
        }

        /* Burst particles */
        .burst-particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #fffef0;
            border-radius: 50%;
            pointer-events: none;
            animation: particleBurst 0.6s ease-out forwards;
            box-shadow: 0 0 10px #ffd700, 0 0 20px rgba(255, 215, 0, 0.5);
        }

        @keyframes particleBurst {
            0% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0);
                opacity: 0;
            }
        }

        /* Flash overlay for completion */
        .completion-flash {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, rgba(255, 254, 240, 0.3) 0%, transparent 70%);
            pointer-events: none;
            opacity: 0;
            animation: flashPulse 0.5s ease-out forwards;
        }

        @keyframes flashPulse {
            0% { opacity: 0; }
            30% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Reset state indicator */
        .artifact.complete .slot.filled .slot-inner {
            background: radial-gradient(circle at center,
                rgba(255, 254, 240, 0.2) 0%,
                rgba(201, 162, 39, 0.1) 50%,
                #2d1f3d 100%
            );
            box-shadow: 0 0 10px rgba(201, 162, 39, 0.2);
        }

        /* Controls */
        .controls {
            margin-top: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .reset-btn {
            padding: 12px 32px;
            background: linear-gradient(180deg, #2d1f3d 0%, #1a1625 100%);
            border: 1px solid rgba(201, 162, 39, 0.4);
            color: rgba(255, 254, 240, 0.8);
            font-size: 0.9rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .reset-btn:hover {
            background: linear-gradient(180deg, #3d2f4d 0%, #2a2035 100%);
            border-color: rgba(201, 162, 39, 0.7);
            box-shadow: 0 0 15px rgba(201, 162, 39, 0.3);
        }

        .reset-btn.pulse {
            animation: btnPulse 1.5s ease-in-out infinite;
        }

        @keyframes btnPulse {
            0%, 100% { box-shadow: 0 0 5px rgba(201, 162, 39, 0.2); }
            50% { box-shadow: 0 0 20px rgba(201, 162, 39, 0.5); }
        }

        /* State indicator */
        .state-label {
            font-size: 0.85rem;
            color: rgba(255, 254, 240, 0.5);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            min-height: 24px;
        }

        /* Instructions */
        .instructions {
            position: fixed;
            bottom: 30px;
            font-size: 0.8rem;
            color: rgba(255, 254, 240, 0.4);
            text-align: center;
        }

        /* Click feedback ripple */
        .slot.click-feedback .slot-inner {
            animation: clickFeedback 0.15s ease-out;
        }

        @keyframes clickFeedback {
            0% { transform: scale(1); }
            50% { transform: scale(0.92); }
            100% { transform: scale(1); }
        }

        /* Filled animation */
        .slot.filling .slot-inner {
            animation: fillSlot 0.3s ease-out forwards;
        }

        @keyframes fillSlot {
            0% {
                transform: scale(0.8);
                filter: brightness(2);
            }
            60% {
                transform: scale(1.15);
            }
            100% {
                transform: scale(1);
                filter: brightness(1);
            }
        }
    </style>
</head>
<body>
    <h1 class="demo-title">Celestial Artifact</h1>

    <div class="artifact" id="artifact">
        <div class="slot next-empty" data-index="0">
            <div class="slot-inner"></div>
        </div>
        <div class="slot" data-index="1">
            <div class="slot-inner"></div>
        </div>
        <div class="slot" data-index="2">
            <div class="slot-inner"></div>
        </div>
        <div class="slot" data-index="3">
            <div class="slot-inner"></div>
        </div>
        <div class="slot" data-index="4">
            <div class="slot-inner"></div>
        </div>
        <div class="slot" data-index="5">
            <div class="slot-inner"></div>
        </div>
    </div>

    <div class="controls">
        <div class="state-label" id="stateLabel">Dormant</div>
        <button class="reset-btn" id="resetBtn">Reset</button>
    </div>

    <div class="instructions">
        Click anywhere to fill slots &bull; Watch the artifact awaken
    </div>

    <script>
        const artifact = document.getElementById('artifact');
        const stateLabel = document.getElementById('stateLabel');
        const resetBtn = document.getElementById('resetBtn');
        const slots = document.querySelectorAll('.slot');

        let filledCount = 0;
        let inputLocked = false;
        let animationTimeouts = [];

        // State thresholds
        const STATES = {
            EMPTY: { min: 0, max: 1, label: 'Dormant', class: '' },
            BUILDING: { min: 2, max: 4, label: 'Awakening', class: 'state-building' },
            READY: { min: 5, max: 5, label: 'Surging', class: 'state-ready' },
            COMPLETE: { min: 6, max: 6, label: 'Transcendent', class: 'complete' }
        };

        function getState(count) {
            if (count >= STATES.COMPLETE.min) return STATES.COMPLETE;
            if (count >= STATES.READY.min) return STATES.READY;
            if (count >= STATES.BUILDING.min) return STATES.BUILDING;
            return STATES.EMPTY;
        }

        function updateState() {
            const state = getState(filledCount);

            // Remove all state classes
            artifact.classList.remove('state-building', 'state-ready', 'complete', 'gathering', 'bursting');

            // Add current state class
            if (state.class) {
                artifact.classList.add(state.class);
            }

            stateLabel.textContent = state.label;

            // Update next-empty hint
            slots.forEach((slot, i) => {
                slot.classList.remove('next-empty');
                if (i === filledCount && filledCount < 6) {
                    slot.classList.add('next-empty');
                }
            });
        }

        function fillNextSlot() {
            if (inputLocked || filledCount >= 6) return;

            const slot = slots[filledCount];

            // Click feedback
            slot.classList.add('click-feedback');
            setTimeout(() => slot.classList.remove('click-feedback'), 150);

            // Fill the slot
            setTimeout(() => {
                slot.classList.add('filling');
                setTimeout(() => {
                    slot.classList.remove('filling');
                    slot.classList.add('filled');
                    filledCount++;
                    updateState();

                    // Check for completion
                    if (filledCount === 6) {
                        triggerCompletion();
                    }
                }, 50);
            }, 100);
        }

        function triggerCompletion() {
            inputLocked = true;
            stateLabel.textContent = 'Transcending...';

            // Phase 1: Gather (400ms)
            artifact.classList.add('gathering');

            const gatherTimeout = setTimeout(() => {
                artifact.classList.remove('gathering');

                // Phase 2: Burst (500ms)
                artifact.classList.add('bursting');
                createBurstParticles();

                // Flash effect
                const flash = document.createElement('div');
                flash.className = 'completion-flash';
                document.body.appendChild(flash);
                setTimeout(() => flash.remove(), 500);

                const burstTimeout = setTimeout(() => {
                    artifact.classList.remove('bursting');
                    artifact.classList.add('complete');
                    stateLabel.textContent = 'Complete';
                    resetBtn.classList.add('pulse');
                    inputLocked = false;
                }, 500);

                animationTimeouts.push(burstTimeout);
            }, 400);

            animationTimeouts.push(gatherTimeout);

            // Fallback timeout (2s safety)
            const fallbackTimeout = setTimeout(() => {
                if (inputLocked) {
                    artifact.classList.remove('gathering', 'bursting');
                    artifact.classList.add('complete');
                    stateLabel.textContent = 'Complete';
                    resetBtn.classList.add('pulse');
                    inputLocked = false;
                }
            }, 2000);

            animationTimeouts.push(fallbackTimeout);
        }

        function createBurstParticles() {
            const artifactRect = artifact.getBoundingClientRect();
            const centerX = artifactRect.left + artifactRect.width / 2;
            const centerY = artifactRect.top + artifactRect.height / 2;

            for (let i = 0; i < 12; i++) {
                const particle = document.createElement('div');
                particle.className = 'burst-particle';

                const angle = (i / 12) * Math.PI * 2;
                const distance = 80 + Math.random() * 60;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;

                particle.style.left = centerX + 'px';
                particle.style.top = centerY + 'px';
                particle.style.setProperty('--tx', tx + 'px');
                particle.style.setProperty('--ty', ty + 'px');

                document.body.appendChild(particle);

                setTimeout(() => particle.remove(), 600);
            }
        }

        function reset() {
            // Cancel all pending animations
            animationTimeouts.forEach(id => clearTimeout(id));
            animationTimeouts = [];

            inputLocked = false;
            filledCount = 0;

            // Reset all classes
            artifact.classList.remove('state-building', 'state-ready', 'complete', 'gathering', 'bursting');
            resetBtn.classList.remove('pulse');

            slots.forEach((slot, i) => {
                slot.classList.remove('filled', 'filling', 'click-feedback', 'next-empty');
                if (i === 0) slot.classList.add('next-empty');
            });

            stateLabel.textContent = 'Dormant';
        }

        // Event listeners
        document.addEventListener('click', (e) => {
            if (e.target.closest('.reset-btn')) return;
            fillNextSlot();
        });

        resetBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            reset();
        });

        // Initialize
        updateState();
    </script>
</body>
</html>
